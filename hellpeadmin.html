<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হেল্প অ্যাডমিন প্যানেল - ইউনিটি বন্ধু গ্রুপ</title>
    <!-- FontAwesome আইকন -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <div class="tg-app-container" style="max-width: 900px;">
        
        <!-- হেডার সেকশন -->
        <header class="tg-header">
            <div class="user-profile-box">
                <div class="avatar-wrapper" style="background: #8b5cf6; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 50px; height: 50px;">
                    <i class="fa-solid fa-hands-holding-child" style="font-size: 24px; color: white;"></i>
                </div>
                <div class="user-info">
                    <h3>হেল্প অ্যাডমিন প্যানেল</h3>
                    <p style="color: #2ecc71; font-size: 0.85rem;"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> অনলাইন</p>
                </div>
            </div>
            <a href="admin.html" class="tg-logout-btn" style="text-decoration: none; display: flex; align-items: center; gap: 6px;"><i class="fa-solid fa-arrow-left"></i> ড্যাশবোর্ড</a>
        </header>

        <!-- মূল কন্টেন্ট: ইমার্জেন্সি রিকোয়েস্ট লিস্ট -->
        <section class="tg-submit-section" style="margin-top: 20px;">
            <div class="feed-title" style="text-align: left; margin-bottom: 15px; color: #8b5cf6;">
                <i class="fa-solid fa-headset"></i> মেম্বারদের হেল্প ও ইমার্জেন্সি রিকোয়েস্টসমূহ
            </div>
            <p style="color: var(--tg-text-muted); font-size: 0.9rem; margin-bottom: 20px;">
                মেম্বারদের পাঠানো সকল সাহায্যের আবেদন নিচে দেখতে পাবেন। প্রয়োজনে তাদের সাথে যোগাযোগ করুন।
            </p>
            
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; color: white; font-size: 0.9rem;">
                    <thead>
                        <tr style="background: rgba(139, 92, 246, 0.2); border-bottom: 2px solid #8b5cf6;">
                            <th style="padding: 12px;">মেম্বারের নাম</th>
                            <th style="padding: 12px;">মোবাইল নম্বর</th>
                            <th style="padding: 12px;">সমস্যার বিবরণ (Details)</th>
                            <th style="padding: 12px;">সময়</th>
                            <th style="padding: 12px; text-align: center;">স্ট্যাটাস / একশন</th>
                        </tr>
                    </thead>
                    <tbody id="emergencyRequestsBody">
                        <tr>
                            <td colspan="5" style="padding: 20px; text-align: center; color: var(--tg-text-muted);">লোড হচ্ছে...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'https://qneicfttboxzorcvhzmk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuZWljZnR0Ym94em9yY3Zoem1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxODk1OTcsImV4cCI6MjA4NTc2NTU5N30.fhiCdQQ65GXjyIG_HrmQyUmxzpuaROlT-AAr_lf4nnE';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadEmergencyRequests() {
            const tableBody = document.getElementById('emergencyRequestsBody');

            try {
                const { data: requests, error } = await _supabase
                    .from('emergency_requests')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (!requests || requests.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align: center; color: var(--tg-text-muted);">এখনো কোনো হেল্প রিকোয়েস্ট আসেনি।</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                requests.forEach(req => {
                    const formattedDate = req.created_at ? new Date(req.created_at).toLocaleString('bn-BD', {
                        dateStyle: 'medium',
                        timeStyle: 'short'
                    }) : 'সময় পাওয়া যায়নি';

                    const mName = req.user_name || 'অজানা মেম্বার';
                    const mPhone = req.mobile || 'নম্বর নেই';
                    const details = req.details || 'বিবরণ নেই';
                    const status = req.status || 'Pending';

                    let statusBadge = status === 'Pending' 
                        ? `<span style="background: #ef4444; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;">Pending</span>` 
                        : `<span style="background: #10b981; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;">Resolved</span>`;

                    tableBody.innerHTML += `
                        <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
                            <td style="padding: 12px; font-weight: 600; color: #f8fafc;">${mName}</td>
                            <td style="padding: 12px; color: #60a5fa;">${mPhone}</td>
                            <td style="padding: 12px; color: #e2e8f0; max-width: 250px; word-break: break-word;">${details}</td>
                            <td style="padding: 12px; color: var(--tg-text-muted); font-size: 0.85rem;">${formattedDate}</td>
                            <td style="padding: 12px; text-align: center; display: flex; gap: 8px; justify-content: center; align-items: center;">
                                ${statusBadge}
                                <button onclick="callMember('${mPhone}')" style="background: #3b82f6; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;" title="কল করুন">
                                    <i class="fa-solid fa-phone"></i>
                                </button>
                                <button onclick="deleteRequest(${req.id})" style="background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;" title="ডিলিট করুন">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

            } catch (err) {
                console.error('Error fetching emergency requests:', err);
                tableBody.innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align: center; color: #ef4444;">ডাটা লোড করতে সমস্যা হয়েছে।</td></tr>`;
            }
        }

        function callMember(phone) {
            if (phone && phone !== 'নম্বর নেই') {
                window.location.href = `tel:${phone}`;
            } else {
                alert('সঠিক মোবাইল নম্বর পাওয়া যায়নি!');
            }
        }

        async function deleteRequest(id) {
            if (confirm('আপনি কি এই রিকোয়েস্টটি ডিলিট করতে চান?')) {
                const { error } = await _supabase.from('emergency_requests').delete().eq('id', id);
                if (error) {
                    alert('ডিলিট করতে সমস্যা হয়েছে: ' + error.message);
                } else {
                    alert('রিকোয়েস্ট সফলভাবে ডিলিট করা হয়েছে!');
                    loadEmergencyRequests();
                }
            }
        }

        loadEmergencyRequests();
    </script>
</body>
</html>
